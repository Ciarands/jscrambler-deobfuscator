# Put files to deobfuscate in ./input (or set INPUT_DIR). Results go to ./output.

services:
  jscrambler-deobfuscator:
    build: .
    container_name: jscrambler-deobfuscator
    volumes:
      - ${INPUT_DIR:-./input}:/app/input:ro
      - ./output:/app/output
    environment:
      - NODE_ENV=production
    command: ["/app/input", "-o", "/app/output", "-v"]

  jscrambler-deobfuscator-dev:
    build:
      context: .
      target: builder
    container_name: jscrambler-deobfuscator-dev
    volumes:
      - ${INPUT_DIR:-./input}:/app/input:ro
      - ./output:/app/output
      - ./src:/app/src
    environment:
      - NODE_ENV=development
    command: ["npx", "tsx", "src/cli.ts", "/app/input", "-o", "/app/output", "-v"]
    profiles:
      - dev
